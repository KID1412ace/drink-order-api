<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店家接單後台</title>
    <style>
        body { font-family: '微軟正黑體', sans-serif; background-color: #2c3e50; color: white; padding: 20px; }
        h2 { text-align: center; margin-bottom: 20px; }
        .order-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .order-card { background: #ecf0f1; color: #333; padding: 15px; border-radius: 8px; width: 280px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .order-header { font-size: 18px; font-weight: bold; border-bottom: 2px solid #bdc3c7; padding-bottom: 10px; margin-bottom: 10px; }
        .item { font-size: 16px; margin-bottom: 2px; font-weight: bold; color: #2980b9; }
        .item-details { font-size: 14px; color: #7f8c8d; margin-left: 20px; margin-bottom: 10px; }
        .refresh-btn { display: block; margin: 0 auto 20px; padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .refresh-btn:hover { background: #c0392b; }
    </style>
</head>
<body>

    <h2>👨‍🍳 飲料店後台 - 即時接單看板</h2>
    <button class="refresh-btn" onclick="fetchOrders()">🔄 重新整理訂單</button>
    
    <div class="order-container" id="orders">
        <!-- 訂單卡片會透過 JavaScript 被塞進這裡 -->
    </div>

    <script>
    // 抓取訂單資料 (原本的功能)
    async function fetchOrders() {
        try {
            const response = await fetch("/api/orders");
            const result = await response.json();
            
            const container = document.getElementById("orders");
            container.innerHTML = ""; 

            if (result.data.length === 0) {
                container.innerHTML = "<h3>目前沒有任何訂單喔！老闆可以休息一下 ☕</h3>";
                return;
            }

            result.data.forEach(order => {
                let itemsHtml = "";
                order.items.forEach(item => {
                    itemsHtml += `
                        <div class="item">🥤 ${item.product_name} (${item.size})</div>
                        <div class="item-details">└ ${item.sugar}, ${item.ice}</div>
                    `;
                });

                // 🌟 新增：在卡片最下方加入一個「✅ 完成訂單」的按鈕，並綁定 order.id
                const cardHtml = `
                    <div class="order-card">
                        <div class="order-header">
                            訂單 #${order.id} - ${order.user_id} 
                            <br><small style="color:#e74c3c;">總金額: $${order.total_price}</small>
                        </div>
                        ${itemsHtml}
                        <button onclick="finishOrder(${order.id})" style="width: 100%; margin-top: 15px; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                            ✅ 完成並結案
                        </button>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        } catch (error) {
            alert("無法取得訂單，請確認後端伺服器是否有啟動！");
            console.error(error);
        }
    }

    // 🌟 新增功能：點擊完成按鈕後，呼叫後端的 DELETE API
    async function finishOrder(orderId) {
        if (!confirm(`確定訂單 #${orderId} 已經做完了嗎？`)) {
            return; // 如果老闆按取消，就什麼都不做
        }

        try {
            // 使用 DELETE 方法呼叫 API
            const response = await fetch(`/api/orders/${orderId}`, {
                method: "DELETE"
            });

            if (response.ok) {
                // 刪除成功後，自動重新抓取一次最新訂單，畫面就會自動更新！
                fetchOrders(); 
            } else {
                alert("結案失敗，請稍後再試。");
            }
        } catch (error) {
            alert("連線失敗！");
            console.error(error);
        }
    }

    // 網頁一打開自動執行
    fetchOrders();
</script>
</body>
</html>
