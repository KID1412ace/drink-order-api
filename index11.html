<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業手搖飲 - 線上點單系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0F172A; /* 曜石黑 */
            --accent-color: #0D9488;  /* 質感翠綠 */
            --bg-color: #F8FAFC;      /* 雲朵白 */
            --card-bg: #FFFFFF;
            --text-main: #334155;
            --text-light: #94A3B8;
            --border-color: #E2E8F0;
        }

        * {
            box-sizing: border-box;
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-weight: 700;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* 左側點單區 */
        .order-section {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        input[type="text"], select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn-add {
            background-color: var(--text-main);
            color: white;
            margin-top: 1rem;
        }

        .btn-add:hover {
            background-color: var(--primary-color);
        }

        .btn-checkout {
            background-color: var(--accent-color);
            color: white;
            margin-top: 1rem;
        }

        .btn-checkout:hover {
            background-color: #0F766E;
        }

        .btn:disabled {
            background-color: var(--text-light);
            cursor: not-allowed;
        }

        /* 右側購物車區 */
        .cart-section {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            height: fit-content;
            position: sticky;
            top: 2rem;
        }

        .cart-item {
            border-bottom: 1px dashed var(--border-color);
            padding: 1rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-details {
            flex-grow: 1;
        }

        .cart-item-title {
            font-weight: 700;
            color: var(--primary-color);
        }

        .cart-item-specs {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-top: 0.25rem;
        }

        .cart-item-price {
            font-weight: 700;
            color: var(--accent-color);
            margin-left: 1rem;
        }

        .btn-remove {
            background: none;
            border: none;
            color: #EF4444;
            cursor: pointer;
            font-size: 0.9rem;
            margin-left: 1rem;
        }

        .cart-total {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: right;
            margin-top: 1.5rem;
            color: var(--primary-color);
        }

        .empty-cart {
            text-align: center;
            color: var(--text-light);
            padding: 2rem 0;
            font-style: italic;
        }

    </style>
</head>
<body>

    <header class="header">
        <h1>🍵 專業手搖飲點單系統</h1>
    </header>

    <div class="container">
        <!-- 左側：點餐選擇區 -->
        <main class="order-section">
            <div class="section-title">01. 顧客資訊</div>
            <div class="form-group">
                <input type="text" id="userName" placeholder="請輸入您的姓名或暱稱" required>
            </div>

            <div class="section-title">02. 選擇飲品</div>
            <div class="form-group">
                <select id="drinkSelect">
                    <option value="" disabled selected>-- 請選擇飲品 --</option>
                    <optgroup label="經典原茶">
                        <option value="1|極上熟成紅茶|35">極上熟成紅茶 - $35</option>
                        <option value="2|高山金萱青茶|40">高山金萱青茶 - $40</option>
                        <option value="3|碳焙鐵觀音|40">碳焙鐵觀音 - $40</option>
                    </optgroup>
                    <optgroup label="香醇奶茶">
                        <option value="4|蜜香珍珠奶茶|55">蜜香珍珠奶茶 - $55</option>
                        <option value="5|黑糖波霸鮮奶|75">黑糖波霸鮮奶 - $75</option>
                        <option value="6|宇治抹茶拿鐵|70">宇治抹茶拿鐵 - $70</option>
                    </optgroup>
                    <optgroup label="清爽鮮果">
                        <option value="7|鮮榨葡萄柚綠|65">鮮榨葡萄柚綠 - $65</option>
                        <option value="8|百香雙響炮|60">百香雙響炮 - $60</option>
                    </optgroup>
                </select>
            </div>

            <div class="options-grid">
                <div class="form-group">
                    <label>容量</label>
                    <select id="sizeSelect">
                        <option value="中杯(M)">中杯 (M)</option>
                        <option value="大杯(L)">大杯 (L) +$10</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>甜度</label>
                    <select id="sugarSelect">
                        <option value="正常糖">正常糖 (100%)</option>
                        <option value="少糖">少糖 (70%)</option>
                        <option value="半糖" selected>半糖 (50%)</option>
                        <option value="微糖">微糖 (30%)</option>
                        <option value="無糖">無糖 (0%)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>冰塊</label>
                    <select id="iceSelect">
                        <option value="正常冰">正常冰</option>
                        <option value="少冰">少冰</option>
                        <option value="微冰" selected>微冰</option>
                        <option value="去冰">去冰</option>
                        <option value="常溫">常溫</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>加料</label>
                    <select id="toppingSelect">
                        <option value="無">無</option>
                        <option value="珍珠">珍珠 +$10</option>
                        <option value="椰果">椰果 +$10</option>
                        <option value="布丁">布丁 +$15</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-add" onclick="addToCart()">+ 加入購物車</button>
        </main>

        <!-- 右側：購物車區 -->
        <aside class="cart-section">
            <div class="section-title">🛒 您的購物車</div>
            
            <div id="cartItemsList">
                <div class="empty-cart">購物車目前是空的喔！</div>
            </div>

            <div class="cart-total">
                總計: $<span id="totalPrice">0</span>
            </div>

            <button class="btn btn-checkout" id="checkoutBtn" onclick="submitOrder()" disabled>確認送出訂單</button>
        </aside>
    </div>

    <script>
        // 購物車狀態管理 (State Management)
        let cart = [];

        // 1. 加入購物車邏輯
        function addToCart() {
            const drinkSelect = document.getElementById('drinkSelect').value;
            if (!drinkSelect) {
                alert('請先選擇一杯飲品！');
                return;
            }

            // 解析飲品資料 (格式: id|名稱|基本價格)
            const [id, name, basePriceStr] = drinkSelect.split('|');
            let basePrice = parseInt(basePriceStr);

            const size = document.getElementById('sizeSelect').value;
            const sugar = document.getElementById('sugarSelect').value;
            const ice = document.getElementById('iceSelect').value;
            const topping = document.getElementById('toppingSelect').value;

            // 計算加價邏輯
            let subtotal = basePrice;
            if (size.includes('L')) subtotal += 10;
            if (topping === '珍珠' || topping === '椰果') subtotal += 10;
            if (topping === '布丁') subtotal += 15;

            // 建立單品物件
            const item = {
                cart_id: Date.now(), // 產生唯一識別碼供刪除使用
                product_id: parseInt(id),
                product_name: name,
                size: size,
                sugar: sugar,
                ice: ice,
                toppings: topping,
                subtotal: subtotal
            };

            cart.push(item);
            updateCartUI();
            
            // 提示動畫或重置表單 (這裡僅作簡單重置)
            document.getElementById('drinkSelect').value = '';
        }

        // 2. 刪除購物車品項
        function removeFromCart(cartId) {
            cart = cart.filter(item => item.cart_id !== cartId);
            updateCartUI();
        }

        // 3. 更新購物車畫面
        function updateCartUI() {
            const cartList = document.getElementById('cartItemsList');
            const totalPriceEl = document.getElementById('totalPrice');
            const checkoutBtn = document.getElementById('checkoutBtn');
            
            cartList.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                cartList.innerHTML = '<div class="empty-cart">購物車目前是空的喔！</div>';
                checkoutBtn.disabled = true;
            } else {
                checkoutBtn.disabled = false;
                cart.forEach(item => {
                    total += item.subtotal;
                    const itemHTML = `
                        <div class="cart-item">
                            <div class="cart-item-details">
                                <div class="cart-item-title">${item.product_name}</div>
                                <div class="cart-item-specs">
                                    ${item.size} | ${item.sugar} | ${item.ice} 
                                    ${item.toppings !== '無' ? `| +${item.toppings}` : ''}
                                </div>
                            </div>
                            <div class="cart-item-price">$${item.subtotal}</div>
                            <button class="btn-remove" onclick="removeFromCart(${item.cart_id})">✕</button>
                        </div>
                    `;
                    cartList.innerHTML += itemHTML;
                });
            }
            totalPriceEl.textContent = total;
        }

        // 4. 送出訂單至後端 API
        async function submitOrder() {
            const userName = document.getElementById('userName').value.trim();
            
            if (!userName) {
                alert('結帳前請記得輸入您的姓名或暱稱喔！');
                document.getElementById('userName').focus();
                return;
            }

            // 防呆：防止重複連點
            const checkoutBtn = document.getElementById('checkoutBtn');
            checkoutBtn.disabled = true;
            checkoutBtn.textContent = '訂單傳送中...';

            const totalAmount = parseInt(document.getElementById('totalPrice').textContent);

            // 嚴格對應 Python 後端的 Pydantic Order 模型
            const orderPayload = {
                user_id: userName,
                total_price: totalAmount,
                items: cart.map(item => ({
                    product_id: item.product_id,
                    product_name: item.product_name,
                    size: item.size,
                    sugar: item.sugar,
                    ice: item.ice,
                    toppings: item.toppings,
                    subtotal: item.subtotal
                }))
            };

            try {
                // 使用相對路徑，系統會自動對應到 Render 的網址
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(orderPayload)
                });

                if (response.ok) {
                    const result = await response.json();
                    alert(`🎉 訂單送出成功！您的訂單編號為：#${result.order_id}\n請稍候片刻，我們將盡快為您製作！`);
                    // 清空購物車與表單
                    cart = [];
                    updateCartUI();
                    document.getElementById('userName').value = '';
                    checkoutBtn.textContent = '確認送出訂單';
                } else {
                    throw new Error('伺服器回傳錯誤狀態');
                }
            } catch (error) {
                alert('❌ 發生錯誤，訂單送出失敗，請檢查網路連線或稍後再試。');
                console.error('Error:', error);
                checkoutBtn.disabled = false;
                checkoutBtn.textContent = '確認送出訂單';
            }
        }
    </script>
</body>
</html>
